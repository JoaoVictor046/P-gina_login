<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-card">
    
    <div class="login">
    <h2>Entrar na sua conta</h2>
    <form action="\enviar" method="POST">
        <div class="usuario"> 
            <label for="usuario" >E-mail ou Usuário</label><br>
            <input type="text" id="usuario" name="usuario" placeholder="Digite seu e-mail ou usuário"><br>
        </div>
        <div class="senha">
            <label for="senha">Senha</label><br>
            <input type="text" id="senha" name="senha" placeholder="Digite sua senha"><br>  
        <button type="submit" class="botao">Entrar</button>
    </forms>
    <a href="cadastro" target="_blank" class="link">cadastre-se</a>
    </main>

</body>
</html>
